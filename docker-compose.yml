services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    command: npx prisma migrate deploy

    environment:
      DATABASE_URL: ${DATABASE_URL}

    networks:
      - infrastructure

    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

    ports:
       - "127.0.0.1:5050:5050"

    environment:
      NODE_ENV: production
      PORT: 5050
      HOSTNAME: 0.0.0.0

      DATABASE_URL: ${DATABASE_URL}
      # Set COOKIE_SECURE=false only if you serve over plain HTTP (no TLS).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/storage/uploads

    volumes:
      - ./storage/uploads:/app/storage/uploads

    networks:
      - infrastructure

  seed:
    profiles:
      - seed

    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    networks:
      - infrastructure

    restart: "no"

networks:
  infrastructure:
    external: true
